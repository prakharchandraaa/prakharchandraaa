<svg fill="none" viewBox="0 0 800 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Cyber Gradient Background -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Electric Neon Text Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glassmorphism Container Gradient -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="796" height="236" x="2" y="2" rx="16" fill="url(#bg-gradient)" stroke="url(#glass-border)" stroke-width="2"/>

  <!-- Background Decorative Grid Lines -->
  <path d="M0 40H800 M0 80H800 M0 120H800 M0 160H800 M0 200H800" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M80 0V240 M160 0V240 M240 0V240 M320 0V240 M400 0V240 M480 0V240 M560 0V240 M640 0V240 M720 0V240" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Glowing Accent Orbs -->
  <circle cx="120" cy="60" r="80" fill="#0EA5E9" fill-opacity="0.15" filter="url(#glow)" />
  <circle cx="680" cy="180" r="100" fill="#8B5CF6" fill-opacity="0.15" filter="url(#glow)" />

  <!-- Animated Wave Decorator -->
  <path d="M0 200 C 150 160, 300 230, 450 190 C 600 150, 700 220, 800 180 L 800 240 L 0 240 Z" fill="#0284C7" fill-opacity="0.2"/>
  <path d="M0 210 C 200 180, 350 240, 500 200 C 650 160, 720 230, 800 200 L 800 240 L 0 240 Z" fill="#38BDF8" fill-opacity="0.25"/>

  <!-- Main Name Header -->
  <text x="50%" y="85" font-family="'Fira Code', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="44" fill="url(#text-gradient)" text-anchor="middle" filter="url(#glow)">
    PRAKHAR CHANDRA
  </text>

  <!-- Subtitle Tagline -->
  <text x="50%" y="130" font-family="'Fira Code', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="18" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">
    FULL-STACK &amp; AI ENGINEER | B.TECH CSE @ UCER PRAYAGRAJ
  </text>

  <!-- Badge Chips inside Header -->
  <g transform="translate(180, 162)">
    <!-- Chip 1 -->
    <rect width="130" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="65" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">🤖 AI &amp; LLMs</text>

    <!-- Chip 2 -->
    <rect x="145" width="150" height="28" rx="14" fill="#1E293B" stroke="#818CF8" stroke-width="1"/>
    <text x="220" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#818CF8" text-anchor="middle">⚡ Full-Stack Web</text>

    <!-- Chip 3 -->
    <rect x="310" width="130" height="28" rx="14" fill="#1E293B" stroke="#C084FC" stroke-width="1"/>
    <text x="375" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#C084FC" text-anchor="middle">🚀 Creator</text>
  </g>
</svg>
